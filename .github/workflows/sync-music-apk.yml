name: Build Sync Music APK

on:
  push:
    paths:
      - 'sync-music/**'
      - '.github/workflows/sync-music-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: sync-music
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: Rename APK
        run: cp sync-music/app/build/outputs/apk/debug/app-debug.apk SyncMusic.apk

      - name: Publish release with fresh APK link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sync-music-${{ github.run_number }}
          name: Sync Music build ${{ github.run_number }}
          files: SyncMusic.apk
