name: Build Personal AI Wife APK

on:
  push:
    paths:
      - 'personal-ai-wife/**'
      - '.github/workflows/personal-ai-wife-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: address of your own AI backend (repository variable). Empty = built-in mock AI.
      EXPO_PUBLIC_AI_BACKEND_URL: ${{ vars.EXPO_PUBLIC_AI_BACKEND_URL }}
    defaults:
      run:
        working-directory: personal-ai-wife
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Align package versions with the Expo SDK
        run: npx expo install --fix -- --legacy-peer-deps

      - name: Check TypeScript
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "error TS" typecheck.log | head -20 | while IFS= read -r l; do echo "::warning::$l"; done
            echo "::warning::TypeScript reported problems (APK build continues). Send the warnings to Claude to fix."
          fi
          exit 0

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        shell: bash
        working-directory: personal-ai-wife/android
        run: |
          set +e +o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: Rename APK
        working-directory: .
        run: cp personal-ai-wife/android/app/build/outputs/apk/release/app-release.apk PersonalAIWife.apk

      - name: Publish release with fresh APK link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: personal-ai-wife-${{ github.run_number }}
          name: Personal AI Wife build ${{ github.run_number }}
          files: PersonalAIWife.apk
